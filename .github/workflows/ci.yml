name: CI - build, lint, test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Compile backend
        run: javac -d backend/out backend/src/*.java backend/test/ApiTest.java
      - name: Backend API tests (in-memory)
        run: java -cp backend/out ApiTest
      - name: Download SQLite driver
        run: |
          mkdir backend/lib
          curl -fsSL -o backend/lib/sqlite-jdbc.jar https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.46.1.3/sqlite-jdbc-3.46.1.3.jar
          curl -fsSL -o backend/lib/slf4j-api.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar
      - name: Backend API tests (SQLite)
        run: java -cp "backend/out:backend/lib/*" ApiTest sqlite

  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend   # the React app lives in /frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install

      # Gate 1: static analysis
      - name: Lint
        run: npm run lint

      # Gate 2: the app must build
      - name: Build
        run: npm run build

      - run: npx playwright install --with-deps chromium

      # Gate 3: smoke tests give fast feedback (fail the pipeline immediately)
      - name: Smoke tests
        run: npm run test:smoke

      # Gate 4: full regression suite of tests for behaviour that must work today
      - name: Regression tests (all non-defect tests)
        run: npm test

      # Reporting only: tests that encode OPEN defects. They are expected to fail
      # until the defect is fixed; when one starts passing, remove its @defect tag
      # so it moves into the blocking gate above.
      - name: Open-defect tests (non-blocking)
        run: npm run test:defects
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
